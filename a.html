<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temp</title>

  <style>
    * { margin: 0; padding: 0; }
    html, body { background: #000; height: 100%; width: 100%; }
    .main { display: flex; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
    .main h1 { color: #fff; text-align: center; margin: 0 auto; font-size: 150px; line-height: 1; }
    .main nav { height: fit-content; max-width: 1000px; width: 100%; justify-content: center; margin-top: 50px; display: flex; gap: 10px; }
    .main nav button { width: calc(25% - 20px); height: 60px; padding: 5px 10px; background: transparent; border: 2px solid #fff; border-radius: 5px; color: #fff; font-size: 20px; cursor: pointer; }
    .main nav button:active { transform: scale(.95); }

    .main h1.bounce-active {
      animation: bounce 0.3s ease;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-15px); /* 위로 통통 튀는 높이 조절 */
      }
    }
  </style>
</head>
<body>
  <div class="main">
    <h1>360P</h1>

    <nav>
      <button>Ab</button>
      <button>Bb</button>
      <button>Cb</button>
      <button>Db</button>
    </nav>
  </div>
</body>

<script>
  function getRandomColor() {
    const letters = '0123456789ABCDEF';
    let color = '#';
    for (let i = 0; i < 6; i++) {
      color += letters[Math.floor(Math.random() * 16)];
    }
    return color;
  }

  const buttons = document.querySelectorAll('nav button');
  // 타이틀 h1 태그를 선택합니다.
  const title = document.querySelector('h1');

  buttons.forEach(button => {
    let clickCount = 0;

    button.addEventListener('click', () => {
      clickCount++;

      // 1. 버튼 색상 제어 (홀수/짝수)
      if (clickCount % 2 === 1) {
        const randomColor = getRandomColor();
        button.style.color = randomColor;
        button.style.borderColor = randomColor;
      } else {
        button.style.color = '';
        button.style.borderColor = '';
      }

      // 2. h1 태그 애니메이션 트리거
      if (title) {
        // 이미 애니메이션 클래스가 적용되어 있다면 제거하여 초기화
        title.classList.remove('bounce-active');
        
        // 브라우저가 클래스 제거를 인식하도록 리플로우(Reflow) 강제 발생
        void title.offsetWidth; 
        
        // 애니메이션 클래스 다시 추가
        title.classList.add('bounce-active');
      }
    });
  });
</script>
</html>
